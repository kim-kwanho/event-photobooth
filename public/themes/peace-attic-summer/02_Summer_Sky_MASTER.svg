<svg width="1200" height="1600" viewBox="0 0 1200 1600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>02_Summer_Sky</title>
  <!-- background -->
  <rect width="1200" height="1600" fill="#FFFFFF"/>
  <!-- photo slots -->
  <rect x="20" y="20" width="580" height="726" fill="#F0F9FF"/>
  <rect x="600" y="20" width="580" height="726" fill="#F0F9FF"/>
  <rect x="20" y="746" width="580" height="726" fill="#F0F9FF"/>
  <rect x="600" y="746" width="580" height="726" fill="#F0F9FF"/>
  <!-- cross lines -->
  <rect x="596.5" y="20" width="7" height="1452" fill="#7DD3FC"/>
  <rect x="20" y="742.5" width="1160" height="7" fill="#7DD3FC"/>
  <!-- bottom bar gradient -->
  <defs>
    <linearGradient id="bottomGrad" x1="600" y1="1472" x2="600" y2="1600" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
  </defs>
  <rect x="20" y="1472" width="1160" height="128" fill="url(#bottomGrad)"/>
  <!-- wave accents -->
  <circle cx="80" cy="1520" r="34" fill="#FFFFFF" fill-opacity="0.35"/>
  <circle cx="220" cy="1540" r="42" fill="#FFFFFF" fill-opacity="0.28"/>
  <circle cx="380" cy="1510" r="36" fill="#FFFFFF" fill-opacity="0.32"/>
  <circle cx="540" cy="1535" r="40" fill="#FFFFFF" fill-opacity="0.25"/>
  <circle cx="700" cy="1515" r="38" fill="#FFFFFF" fill-opacity="0.30"/>
  <circle cx="860" cy="1542" r="44" fill="#FFFFFF" fill-opacity="0.27"/>
  <circle cx="1020" cy="1512" r="36" fill="#FFFFFF" fill-opacity="0.33"/>
  <circle cx="1140" cy="1530" r="32" fill="#FFFFFF" fill-opacity="0.28"/>
  <!-- cloud decor -->
  <circle cx="52" cy="44" r="16" fill="#FFFFFF" fill-opacity="0.88"/>
  <circle cx="68" cy="38" r="18" fill="#FFFFFF" fill-opacity="0.88"/>
  <circle cx="86" cy="44" r="15" fill="#FFFFFF" fill-opacity="0.88"/>
  <!-- sun decor -->
  <g stroke="#FBBF24" stroke-width="3" stroke-linecap="round">
    <line x1="1156" y1="44" x2="1156" y2="28"/>
    <line x1="1172" y1="44" x2="1184" y2="44"/>
    <line x1="1156" y1="60" x2="1156" y2="72"/>
    <line x1="1140" y1="44" x2="1128" y2="44"/>
    <line x1="1167" y1="33" x2="1176" y2="24"/>
    <line x1="1167" y1="55" x2="1176" y2="64"/>
    <line x1="1145" y1="55" x2="1136" y2="64"/>
    <line x1="1145" y1="33" x2="1136" y2="24"/>
  </g>
  <circle cx="1156" cy="44" r="22" fill="#FBBF24"/>
  <!-- bottom text -->
  <text x="600" y="1540" text-anchor="middle" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="36" font-weight="700" letter-spacing="2">SUMMER SKY</text>
  <!-- frame border -->
  <rect x="10" y="10" width="1180" height="1580" stroke="#0284C7" stroke-width="20" fill="none"/>
